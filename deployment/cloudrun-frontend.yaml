apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: resilience-ai-frontend
  labels:
    cloud.googleapis.com/location: asia-south1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
      - image: gcr.io/${GOOGLE_CLOUD_PROJECT}/resilience-ai-frontend:latest
        ports:
        - name: http1
          containerPort: 80
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
